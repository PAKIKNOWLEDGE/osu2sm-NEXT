[package]
name = "osu2sm"
version = "0.2.0"
authors = ["negamartin <martin.andrighetti@gmail.com>", "PAKIKNOWLEDGE"]
edition = "2018"

[dependencies]
anyhow = "1"
walkdir = "2"
fxhash = "0.2"
ron = "0.6"
serde = { version = "1", features = ["derive"] }
mp3-duration = "0.1"
flexi_logger = "0.16"
log = "0.4"
rand = "0.7"
rand_xoshiro = "0.4"
natord = "1"

# GUI dependencies (only pulled in by the `osu2sm-gui` binary).
eframe = { version = "0.27", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.27", optional = true }
egui_extras = { version = "0.27", optional = true, features = ["all_loaders"] }
rfd = { version = "0.14", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd"]

[[bin]]
name = "osu2sm"
path = "src/main.rs"

[[bin]]
name = "osu2sm-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]